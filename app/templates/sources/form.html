{% extends "layout/base.html" %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <h1>Add Data Source</h1>
    
    <div class="card">
        <div style="display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem;">
            <button onclick="setTab('csv')" id="tab-csv" class="btn btn-primary" style="border-bottom-left-radius: 0; border-bottom-right-radius: 0;">CSV Upload</button>
            <button onclick="setTab('manual')" id="tab-manual" class="btn btn-outline" style="border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: none;">Manual Entry</button>
        </div>

        <form id="form-csv" action="/sources/new/csv" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>Source Name</label>
                <input name="name" required placeholder="e.g. Q1 Sales Data">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>CSV File</label>
                <input type="file" name="file" accept=".csv" required style="padding: 0.5rem; border: 1px dashed var(--border);">
                <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.5rem;">
                    Upload a CSV file with headers. Dates will be auto-detected.
                </p>
            </div>
            <button type="submit" class="btn btn-primary">Upload & Process</button>
        </form>

        <form id="form-manual" action="/sources/new/manual" method="post" style="display: none;">
            <div class="form-group">
                <label>Source Name</label>
                <input name="name" required placeholder="e.g. Monthly KPI Targets">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="2"></textarea>
            </div>
            <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1rem;">
                Create an empty source. You can add records manually or via API later.
            </p>
            <button type="submit" class="btn btn-primary">Create Empty Source</button>
        </form>
    </div>
</div>

<script>
function setTab(tab) {
    document.getElementById('form-csv').style.display = tab === 'csv' ? 'block' : 'none';
    document.getElementById('form-manual').style.display = tab === 'manual' ? 'block' : 'none';
    
    const btnCsv = document.getElementById('tab-csv');
    const btnManual = document.getElementById('tab-manual');
    
    if (tab === 'csv') {
        btnCsv.className = 'btn btn-primary';
        btnManual.className = 'btn btn-outline';
        btnManual.style.borderBottom = 'none';
    } else {
        btnCsv.className = 'btn btn-outline';
        btnManual.className = 'btn btn-primary';
        btnCsv.style.borderBottom = 'none';
    }
}
</script>
{% endblock %}
