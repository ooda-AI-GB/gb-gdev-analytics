{% extends "layout/base.html" %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <h1 style="margin-bottom: 2rem;">{{ 'Edit' if dashboard else 'New' }} Dashboard</h1>
    
    <form method="post" class="card">
        <div class="form-group">
            <label for="name">Dashboard Name</label>
            <input type="text" id="name" name="name" value="{{ dashboard.name if dashboard else '' }}" required placeholder="e.g. Sales Overview">
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" placeholder="Optional description">{{ dashboard.description if dashboard else '' }}</textarea>
        </div>
        
        {% if not dashboard %}
        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" id="is_default" name="is_default" value="true" style="width: auto; margin: 0;">
            <label for="is_default" style="margin: 0;">Set as default dashboard</label>
        </div>
        {% endif %}
        
        <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary">Save Dashboard</button>
            <a href="/dashboards" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
